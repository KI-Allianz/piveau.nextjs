services:
  piveau-nextjs:
    container_name: piveau-nextjs
    image: docker.gitlab.gwdg.de/hammerhai/data/catalog-frontend:${TAG:-latest}
    # all that is needed to build prod live image
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      # DATABASE_URL needed for static site generation - getStaticProps
      # NEXTAUTH_URL needed for CustomHead SEO
    ports:
      - "3000:3000"
    #command: sleep infinity
    # env_file:
    # - ./.dockerenv
    environment:
      SEARCH_HUB_URL: ${SEARCH_HUB_URL:?SEARCH_HUB_URL is required}
      REPO_HUB_URL: ${REPO_HUB_URL:?REPO_HUB_URL is required}
