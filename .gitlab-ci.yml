stages:
  - test
  - build
  - deploy

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - cache/Cypress/

cypress-tests:
  stage: test
  allow_failure: true
  image: cypress/browsers:22.15.0

  variables:
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"
    AUTH_DISABLED: "true"
    NEXT_PUBLIC_AUTH_DISABLED: "true"
    DOMAIN: "http://localhost:3000"
    SEARCH_HUB_URL: "https://ki-daten.hlrs.de/hub/search/"
    REPO_HUB_URL: "https://ki-daten.hlrs.de/hub/repo/"

  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir $CI_PROJECT_DIR/.pnpm-store
    - pnpm install --frozen-lockfile

  script:
    - pnpm dlx start-server-and-test dev http://localhost:3000 "npx cypress run"

  artifacts:
    name: "cypress-results-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 1 week
    paths:
      - cypress/videos
      - cypress/screenshots

build-image:
  stage: build
  # This job installs dependencies inside the Docker build, so restoring the
  # host-side pnpm and Cypress caches only bloats the Kaniko build context.
  cache: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    - EXTRA_TAG=""
    - if [ "$CI_COMMIT_BRANCH" = "production" ]; then EXTRA_TAG="--destination ${CI_REGISTRY_IMAGE}:latest"; fi

    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg GIT_COMMIT_HASH="${CI_COMMIT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH}" \
        ${EXTRA_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "staging"

trigger-deploy:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      ENV_UPPER=$(echo "${CI_COMMIT_BRANCH}" | tr '[:lower:]' '[:upper:]')

      eval "TARGET_IP=\$${ENV_UPPER}_IP"
      eval "TARGET_SECRET=\$${ENV_UPPER}_SECRET"

      if [ -z "$TARGET_IP" ]; then
        echo "ERROR: ${ENV_UPPER}_IP is not defined in GitLab CI/CD variables!"
        exit 1
      fi

      echo "Triggering deployment to ${CI_COMMIT_BRANCH} environment at ${TARGET_IP}..."

      curl --fail-with-body --show-error \
        -H "Content-Type: application/json" \
        -H "X-Webhook-Token: ${TARGET_SECRET}" \
        -H "X-Deploy-Env: ${CI_COMMIT_BRANCH}" \
        --data '{}' \
        "https://${TARGET_IP}/hooks/redeploy-app"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "production"
